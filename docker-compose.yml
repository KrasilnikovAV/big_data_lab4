services:
  vault-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/bbc-news-classifier_v4:latest
    command: ["python", "scripts/bootstrap_clickhouse.py"]
    volumes:
      - vault_runtime:/vault
      - ./secrets:/run/secrets:ro

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - vault_runtime:/etc/clickhouse-server/users.d

  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/bitnami/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic prediction-results \
          --partitions 1 \
          --replication-factor 1

  bbc-news-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/bbc-news-classifier_v4:latest
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_PREDICTIONS_TOPIC: "prediction-results"
      KAFKA_CONSUMER_GROUP: "bbc-news-prediction-consumers"
      MODEL_VERSION: "lab4"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health | grep -q '\"status\":\"ok\"' && curl -fsS http://localhost:8000/health | grep -q '\"database\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./secrets:/run/secrets:ro

  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/bbc-news-classifier_v4:latest
    command: ["python", "-m", "bbc_news.consumer"]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_PREDICTIONS_TOPIC: "prediction-results"
      KAFKA_CONSUMER_GROUP: "bbc-news-prediction-consumers"
      MODEL_VERSION: "lab4"
    restart: unless-stopped
    volumes:
      - ./secrets:/run/secrets:ro

volumes:
  clickhouse_data:
  vault_runtime:
